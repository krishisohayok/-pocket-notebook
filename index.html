
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Notebook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#202938}
header{background:#2457c5;color:white;padding:20px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd3df;border-radius:8px;font-size:16px}
textarea{min-height:110px}
button{background:#2457c5;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#65758b}
.danger{background:#c0392b}
.restore{background:#218838}
.note{border-left:5px solid #2457c5}
.note h3{margin:4px 0}
.small{font-size:13px;color:#65758b}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px}
.hidden{display:none}
.color-label{font-weight:bold;margin-top:10px;display:block}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
</style>
</head>

<body>
<header>
<h2>📒 Pocket Notebook</h2>
<p>আপনার ব্যক্তিগত ডিজিটাল নোটবুক</p>
</header>

<main>

<section id="auth" class="card">
<h3>অ্যাকাউন্টে প্রবেশ করুন</h3>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button onclick="signUp()">নতুন অ্যাকাউন্ট তৈরি</button>
<button onclick="signIn()" class="secondary">লগইন করুন</button>
<p id="authMsg" class="small"></p>
</section>

<section id="app" class="hidden">

<div class="card">
<p id="userInfo"></p>
<button class="secondary" onclick="signOut()">লগআউট</button>

<h3>নতুন নোট লিখুন</h3>
<input id="title" placeholder="নোটের শিরোনাম">

<select id="category">
<option>ব্যক্তিগত</option>
<option>কাজ</option>
<option>পড়াশোনা</option>
<option>কৃষি</option>
<option>অন্যান্য</option>
</select>

<textarea id="content" placeholder="আপনার নোট লিখুন..."></textarea>

<label class="color-label">🎨 নোটের রং নির্বাচন করুন</label>
<select id="noteColor">
<option value="#ffffff">⚪ সাদা</option>
<option value="#fff2a8">🟡 হলুদ</option>
<option value="#d9f5de">🟢 সবুজ</option>
<option value="#dcebff">🔵 নীল</option>
<option value="#f9dde8">🌸 গোলাপি</option>
<option value="#e9dfff">🟣 বেগুনি</option>
</select>

<button onclick="saveNote()">নোট সংরক্ষণ করুন</button>
<button id="cancelEdit" class="secondary hidden" onclick="cancelEditing()">এডিট বাতিল করুন</button>
<p id="saveMsg" class="small"></p>
</div>

<div class="card">
<h3>📒 আমার নোট</h3>

<div class="tabs">
<button id="activeTab" onclick="showActive()">আমার নোট</button>
<button id="trashTab" class="secondary" onclick="showTrash()">🗑️ Trash</button>
</div>

<input id="search" placeholder="নোট খুঁজুন..." oninput="renderNotes()">
 <h3>📥 Backup & Export</h3>
<button onclick="exportBackup()">📥 সব নোট Backup করুন</button>

<label style="display:block;margin-top:12px">
  পুরোনো Backup ফিরিয়ে আনুন
</label>
<input type="file" id="backupFile" accept=".json,application/json" onchange="importBackup(event)">
<p class="small">আপনার Backup ফাইল নির্বাচন করুন।</p>
<div id="notes"></div>
</div>

</section>
</main>

<script>
const SUPABASE_URL = "https://pcxfeframdfqnksoouyo.supabase.co";

const SUPABASE_KEY = "sb_publishable__hT8q7kVm3vImNmOzs59hA_AuaZVtbe";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let allNotes = [];
let editingId = null;
let trashMode = false;

const $ = id => document.getElementById(id);

async function signUp(){
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email || password.length<6){
  $("authMsg").textContent="সঠিক ইমেইল এবং অন্তত ৬ অক্ষরের পাসওয়ার্ড দিন।";
  return;
 }

 const {data,error}=await db.auth.signUp({email,password});
 $("authMsg").textContent=error ? error.message : "অ্যাকাউন্ট তৈরি হয়েছে।";
 if(data.session) await startApp(data.session.user);
}

async function signIn(){
 const email=$("email").value.trim();
 const password=$("password").value;

 const {data,error}=await db.auth.signInWithPassword({email,password});
 $("authMsg").textContent=error ? error.message : "লগইন সফল!";
 if(data.session) await startApp(data.session.user);
}

async function signOut(){
 await db.auth.signOut();
 currentUser=null;
 allNotes=[];
 $("app").classList.add("hidden");
 $("auth").classList.remove("hidden");
}

async function startApp(user){
 currentUser=user;
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("userInfo").textContent="লগইন: "+user.email;
 await syncNotes();
}

async function syncNotes(){
 const {data,error}=await db.from("notes")
 .select("*")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 if(error){
  $("saveMsg").textContent="ক্লাউড সমস্যা: "+error.message;
  return;
 }

 allNotes=data || [];
 renderNotes();
}

async function saveNote(){
 const titleValue=$("title").value.trim();
 const contentValue=$("content").value.trim();

 if(!titleValue && !contentValue){
  $("saveMsg").textContent="আগে কিছু লিখুন।";
  return;
 }

 const note={
  title:titleValue || "শিরোনামহীন নোট",
  content:contentValue,
  category:$("category").value,
  color:$("noteColor").value,
  user_id:currentUser.id
 };

 let result;

 if(editingId){
  result=await db.from("notes").update(note)
  .eq("id",editingId)
  .eq("user_id",currentUser.id)
  .is("deleted_at",null);
 }else{
  result=await db.from("notes").insert(note);
 }

 if(result.error){
  $("saveMsg").textContent="সংরক্ষণ হয়নি: "+result.error.message;
  return;
 }

 clearForm();
 $("saveMsg").textContent="নোট সংরক্ষিত হয়েছে। 🎉";
 await syncNotes();
}

function clearForm(){
 $("title").value="";
 $("content").value="";
 $("category").value="ব্যক্তিগত";
 $("noteColor").value="#ffffff";
 editingId=null;
 $("cancelEdit").classList.add("hidden");
}

function cancelEditing(){
 clearForm();
 $("saveMsg").textContent="এডিট বাতিল হয়েছে।";
}

function showActive(){
 trashMode=false;
 $("activeTab").classList.remove("secondary");
 $("trashTab").classList.add("secondary");
 clearSearch();
 renderNotes();
}

function showTrash(){
 trashMode=true;
 $("trashTab").classList.remove("secondary");
 $("activeTab").classList.add("secondary");
 clearSearch();
 renderNotes();
}

function clearSearch(){
 $("search").value="";
}

function renderNotes(){
 const q=$("search").value.toLowerCase();
 const box=$("notes");
 box.innerHTML="";

 let filtered=allNotes.filter(n=>{
  const inTrash=!!n.deleted_at;
  return inTrash===trashMode &&
  ((n.title || "").toLowerCase().includes(q) ||
  (n.content || "").toLowerCase().includes(q));
 });

 if(!trashMode){
  filtered.sort((a,b)=>Number(!!b.is_pinned)-Number(!!a.is_pinned));
 }

 if(!filtered.length){
  box.innerHTML=trashMode
  ? "<p>Trash খালি আছে।</p>"
  : "<p>এখনও কোনো নোট নেই।</p>";
  return;
 }

 filtered.forEach(n=>{
  const div=document.createElement("div");
  div.className="card note";
  div.style.backgroundColor=n.color || "#ffffff";

  const h=document.createElement("h3");
  h.textContent=n.title || "শিরোনামহীন নোট";

  const p=document.createElement("p");
  p.textContent=n.content || "";

  const small=document.createElement("p");
  small.className="small";
  small.textContent=(n.is_pinned ? "📌 পিন করা • " : "")+(n.category || "অন্যান্য");

  const actions=document.createElement("div");
  actions.className="actions";

  if(trashMode){
   const restore=document.createElement("button");
   restore.textContent="♻️ Restore";
   restore.className="restore";
   restore.onclick=()=>restoreNote(n.id);

   const permanent=document.createElement("button");
   permanent.textContent="স্থায়ীভাবে মুছুন";
   permanent.className="danger";
   permanent.onclick=()=>permanentDelete(n.id);

   actions.append(restore,permanent);
  }else{
   const pin=document.createElement("button");
   pin.textContent=n.is_pinned ? "📌 আনপিন" : "📌 পিন";
   pin.className="secondary";
   pin.onclick=()=>togglePin(n.id,n.is_pinned);

   const edit=document.createElement("button");
   edit.textContent="এডিট";
   edit.onclick=()=>editNote(n.id);

   const del=document.createElement("button");
   del.textContent="🗑️ মুছুন";
   del.className="danger";
   del.onclick=()=>deleteNote(n.id);

   const share=document.createElement("button");
share.textContent="📤 শেয়ার";
share.className="secondary";
share.onclick=()=>shareNote(n);

actions.append(share,pin,edit,del);
  }

  div.append(h,p,small,actions);
  box.append(div);
 });
}
async function shareNote(n){

 const title=n.title || "Pocket Notebook";
 const text=title+"\n\n"+(n.content || "");

 if(navigator.share){
  try{
   await navigator.share({
    title:title,
    text:text
   });
  }catch(error){
   if(error.name!=="AbortError"){
    $("saveMsg").textContent="Share করতে সমস্যা হয়েছে।";
   }
  }
 }else{
  try{
   await navigator.clipboard.writeText(text);
   $("saveMsg").textContent="নোট কপি হয়েছে। এখন শেয়ার করুন।";
  }catch(error){
   prompt("নোটটি কপি করুন:",text);
  }
 }
}
async function togglePin(id,isPinned){
 const {error}=await db.from("notes")
 .update({is_pinned:!isPinned})
 .eq("id",id)
 .eq("user_id",currentUser.id)
 .is("deleted_at",null);

 if(error){
  $("saveMsg").textContent="পিন করতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="পিন পরিবর্তন হয়েছে।";
}

function editNote(id){
 const n=allNotes.find(x=>x.id===id && !x.deleted_at);
 if(!n)return;

 $("title").value=n.title || "";
 $("content").value=n.content || "";
 $("category").value=n.category || "ব্যক্তিগত";
 $("noteColor").value=n.color || "#ffffff";

 editingId=id;
 $("cancelEdit").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteNote(id){
 if(!confirm("নোটটি Trash-এ পাঠাবেন?"))return;

 const {error}=await db.from("notes")
 .update({deleted_at:new Date().toISOString()})
 .eq("id",id)
 .eq("user_id",currentUser.id)
 .is("deleted_at",null);

 if(error){
  $("saveMsg").textContent="মুছতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট Trash-এ পাঠানো হয়েছে।";
}

async function restoreNote(id){
 const {error}=await db.from("notes")
 .update({deleted_at:null})
 .eq("id",id)
 .eq("user_id",currentUser.id);

 if(error){
  $("saveMsg").textContent="Restore করতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট ফিরিয়ে আনা হয়েছে। ♻️";
}

async function permanentDelete(id){
 if(!confirm("এই নোটটি চিরতরে মুছে ফেলবেন? এটি আর ফিরিয়ে আনা যাবে না।"))return;

 const {error}=await db.from("notes")
 .delete()
 .eq("id",id)
 .eq("user_id",currentUser.id);

 if(error){
  $("saveMsg").textContent="স্থায়ীভাবে মুছতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট স্থায়ীভাবে মুছে ফেলা হয়েছে।";
}

function exportBackup(){

 if(!currentUser){
  alert("আগে লগইন করুন।");
  return;
 }

 const backup={
  app:"Pocket Notebook",
  version:1,
  exported_at:new Date().toISOString(),
  notes:allNotes.map(n=>({
   title:n.title || "",
   content:n.content || "",
   category:n.category || "অন্যান্য",
   color:n.color || "#ffffff",
   is_pinned:!!n.is_pinned,
   deleted_at:n.deleted_at || null
  }))
 };

 const blob=new Blob(
  [JSON.stringify(backup,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="Pocket-Notebook-Backup.json";
 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url);

 $("saveMsg").textContent="Backup ডাউনলোড হয়েছে! 📥";
}

async function importBackup(event){

 const file=event.target.files[0];

 if(!file)return;

 try{

  const text=await file.text();
  const backup=JSON.parse(text);

  if(backup.app!=="Pocket Notebook" ||
     !Array.isArray(backup.notes)){
   throw new Error("সঠিক Pocket Notebook Backup ফাইল নয়।");
  }

  if(!confirm(
   backup.notes.length+
   "টি নোট Import করবেন? আগের নোট মুছবে না, নতুন কপি যুক্ত হবে।"
  )){
   event.target.value="";
   return;
  }

  const notes=backup.notes.map(n=>({
   title:String(n.title || "শিরোনামহীন নোট"),
   content:String(n.content || ""),
   category:String(n.category || "অন্যান্য"),
   color:typeof n.color==="string" ? n.color : "#ffffff",
   is_pinned:!!n.is_pinned,
   deleted_at:n.deleted_at || null,
   user_id:currentUser.id
  }));

  if(notes.length===0){
   alert("Backup-এ কোনো নোট নেই।");
   return;
  }

  const {error}=await db.from("notes").insert(notes);

  if(error)throw error;

  await syncNotes();

  $("saveMsg").textContent=
   "Backup থেকে "+notes.length+"টি নোট ফিরিয়ে আনা হয়েছে!";

 }catch(error){

  alert("Backup Import করতে সমস্যা: "+error.message);

 }finally{
  event.target.value="";
 }
}
 
db.auth.getSession().then(({data})=>{
 if(data.session) startApp(data.session.user);
});
</script>

</body>
</html>
