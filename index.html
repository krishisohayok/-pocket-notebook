
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Notebook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#202938}
header{background:#2457c5;color:white;padding:20px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}

textarea{min-height:110px}
button{background:#2457c5;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#65758b}
.danger{background:#c0392b}
.restore{background:#218838}

.small{font-size:13px;color:#65758b}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px}
.hidden{display:none}
.color-label{font-weight:bold;margin-top:10px;display:block}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
</style>
</head>

<body>
<header>
<h2>📒 Pocket Notebook</h2>
<p>আপনার ব্যক্তিগত ডিজিটাল নোটবুক</p>
</header>

<main>

<section id="auth" class="card">
<h3>অ্যাকাউন্টে প্রবেশ করুন</h3>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button onclick="signUp()">নতুন অ্যাকাউন্ট তৈরি</button>
<button onclick="signIn()" class="secondary">লগইন করুন</button>
<p id="authMsg" class="small"></p>
</section>

<section id="appLock" class="card hidden">
  <h3>🔐 Pocket Notebook Lock</h3>
  <p id="lockMessage">আপনার PIN সেট করুন</p>

  <div id="pinSetup">
    <input
      id="newPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="৬ সংখ্যার PIN"
    >
    <input
      id="confirmPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="আবার PIN লিখুন"
    >
    <button onclick="setAppPin()">PIN সংরক্ষণ করুন</button>
  </div>

  <div id="pinUnlock" class="hidden">
    <input
      id="unlockPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="আপনার PIN লিখুন"
    >
    <button onclick="unlockApp()">Unlock করুন</button>
  </div>

  <p id="pinMsg" class="small"></p>
  <button class="secondary" onclick="signOut()">লগআউট</button>
</section>
  
<section id="app" class="hidden">

<div class="card">
<p id="userInfo"></p>
<button class="secondary" onclick="signOut()">লগআউট</button>

<h3>নতুন নোট লিখুন</h3>
<input id="title" placeholder="নোটের শিরোনাম">

<select id="category">
<option>ব্যক্তিগত</option>
<option>কাজ</option>
<option>পড়াশোনা</option>
<option>কৃষি</option>

</select>

<textarea id="content" placeholder="আপনার নোট লিখুন..."></textarea>

<label class="color-label">🎨 নোটের রং নির্বাচন করুন</label>
<select id="noteColor">
<option value="#ffffff">⚪ সাদা</option>
<option value="#fff2a8">🟡 হলুদ</option>
<option value="#d9f5de">🟢 সবুজ</option>
<option value="#dcebff">🔵 নীল</option>
<option value="#f9dde8">🌸 গোলাপি</option>
<option value="#e9dfff">🟣 বেগুনি</option>
</select>

<label style="display:block;margin-top:12px">
  📎 ছবি বা PDF ফাইল সংযুক্ত করুন
</label>
<input
  type="file"
  id="noteFiles"
  accept="image/*,.pdf,.doc,.docx"
  multiple
>
<p class="small">একাধিক ছবি বা ফাইল নির্বাচন করতে পারবেন।</p>
 
<button onclick="saveNote()">নোট সংরক্ষণ করুন</button>
<button id="cancelEdit" class="secondary hidden" onclick="cancelEditing()">এডিট বাতিল করুন</button>
<p id="saveMsg" class="small"></p>
</div>

<div class="card">
<h3>📒 আমার নোট</h3>

<div class="tabs">
<button id="activeTab" onclick="showActive()">আমার নোট</button>
<button id="trashTab" class="secondary" onclick="showTrash()">🗑️ Trash</button>
</div>

<input id="search" placeholder="নোট খুঁজুন..." oninput="renderNotes()">
 <h3>📥 Backup & Export</h3>
<button onclick="exportBackup()">📥 সব নোট Backup করুন</button>

<label style="display:block;margin-top:12px">
  পুরোনো Backup ফিরিয়ে আনুন
</label>
<input type="file" id="backupFile" accept=".json,application/json" onchange="importBackup(event)">
<p class="small">আপনার Backup ফাইল নির্বাচন করুন।</p>
<div id="notes"></div>
</div>

</section>
</main>

function pinStorageKey(userId){
 return "pocket_pin_" + userId;
}

async function makePinHash(pin,salt){
 const key=await crypto.subtle.importKey(
  "raw",
  new TextEncoder().encode(pin),
  "PBKDF2",
  false,
  ["deriveBits"]
 );

 const bits=await crypto.subtle.deriveBits({
  name:"PBKDF2",
  salt:salt,
  iterations:150000,
  hash:"SHA-256"
 },key,256);

 return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

function pinStorageKey(userId){
 return "pocket_pin_" + userId;
}

async function makePinHash(pin,salt){
 const key=await crypto.subtle.importKey(
  "raw",
  new TextEncoder().encode(pin),
  "PBKDF2",
  false,
  ["deriveBits"]
 );

 const bits=await crypto.subtle.deriveBits({
  name:"PBKDF2",
  salt:salt,
  iterations:150000,
  hash:"SHA-256"
 },key,256);

 return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
  
let pocketAutoLockTimer = null;
let pocketAutoLockEventsReady = false;

function resetPocketAutoLockTimer(){

 if(pocketAutoLockTimer){
  clearTimeout(pocketAutoLockTimer);
 }

 if(!currentUser || $("app").classList.contains("hidden")){
  return;
 }

 pocketAutoLockTimer = setTimeout(()=>{
  lockPocketNotebook();
 }, 5 * 60 * 1000);
}

function lockPocketNotebook(){

 if(!currentUser || $("app").classList.contains("hidden")){
  return;
 }

 if(pocketAutoLockTimer){
  clearTimeout(pocketAutoLockTimer);
  pocketAutoLockTimer=null;
 }

 allNotes=[];

 $("app").classList.add("hidden");
 $("appLock").classList.remove("hidden");

 $("lockMessage").textContent="";

 $("pinSetup").classList.add("hidden");
 $("pinUnlock").classList.remove("hidden");

 $("unlockPin").value="";
 $("pinMsg").textContent="আবার খুলতে আপনার PIN দিন।";
}

function setupPocketAutoLock(){

 if(pocketAutoLockEventsReady) return;

 ["pointerdown","keydown","touchstart","scroll"].forEach(eventName=>{
  document.addEventListener(
   eventName,
   resetPocketAutoLockTimer,
   {passive:true}
  );
 });

 pocketAutoLockEventsReady=true;
}
  


async function enterNotebook(){
 $("appLock").classList.add("hidden");
 $("app").classList.remove("hidden");

 await syncNotes();

 setupPocketAutoLock();
 resetPocketAutoLockTimer();
}

async function setAppPin(){
 const pin=$("newPin").value;
 const confirm=$("confirmPin").value;

 if(!/^[0-9]{6}$/.test(pin)){
  $("pinMsg").textContent="৬ সংখ্যার PIN দিন।";
  return;
 }

 if(pin!==confirm){
  $("pinMsg").textContent="দুটি PIN মিলছে না।";
  return;
 }

 try{
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const hash=await makePinHash(pin,salt);

  localStorage.setItem(
   pinStorageKey(currentUser.id),
   JSON.stringify({
    salt:btoa(String.fromCharCode(...salt)),
    hash:hash
   })
  );

  $("pinMsg").textContent="PIN সফলভাবে সংরক্ষিত!";
  await enterNotebook();

 }catch(error){
  $("pinMsg").textContent="PIN সংরক্ষণ করা যায়নি।";
 }
}

async function unlockApp(){
 const pin=$("unlockPin").value;

 if(!/^[0-9]{6}$/.test(pin)){
  $("pinMsg").textContent="সঠিক ৬ সংখ্যার PIN দিন।";
  return;
 }

 try{
  const saved=JSON.parse(
   localStorage.getItem(pinStorageKey(currentUser.id))
  );

  if(!saved){
   $("pinMsg").textContent="PIN তথ্য পাওয়া যায়নি।";
   return;
  }

  const salt=Uint8Array.from(
   atob(saved.salt),
   c=>c.charCodeAt(0)
  );

  const hash=await makePinHash(pin,salt);

  if(hash!==saved.hash){
   $("pinMsg").textContent="ভুল PIN! আবার চেষ্টা করুন।";
   $("unlockPin").value="";
   return;
  }

  $("pinMsg").textContent="";
  await enterNotebook();

 }catch(error){
  $("pinMsg").textContent="PIN যাচাই করা যায়নি।";
 }
}

if(pocketAutoLockTimer){
 clearTimeout(pocketAutoLockTimer);
 pocketAutoLockTimer=null;
  }
 await db.auth.signOut();

 currentUser=null;
 allNotes=[];

 $("app").classList.add("hidden");

 $("newPin").value="";

}

async function startApp(user){
 currentUser=user;

 allNotes=[];

 $("auth").classList.add("hidden");
 $("app").classList.add("hidden");
 $("appLock").classList.remove("hidden");

 $("userInfo").textContent="লগইন: "+user.email;

 $("newPin").value="";
 $("confirmPin").value="";
 $("unlockPin").value="";
 $("pinMsg").textContent="";

 const saved=localStorage.getItem(
  pinStorageKey(user.id)
 );

 if(saved){
  $("lockMessage").textContent="আপনার PIN লিখুন";
  $("pinSetup").classList.add("hidden");
  $("pinUnlock").classList.remove("hidden");
 }else{
  $("lockMessage").textContent="আপনার ৬ সংখ্যার PIN সেট করুন";
  $("pinSetup").classList.remove("hidden");
  $("pinUnlock").classList.add("hidden");
 }
}
  
async function syncNotes(){

 if(!currentUser) return;

 const userId=currentUser.id;

 // পুরোনো অ্যাকাউন্টের নোট পরিষ্কার
 allNotes=[];
 renderNotes();

 const {data,error}=await db.from("notes")
  .select("*")
  .eq("user_id",userId)
  .order("created_at",{ascending:false});

 // এর মধ্যে অ্যাকাউন্ট পরিবর্তন হলে
 if(!currentUser || currentUser.id!==userId){
  return;
 }

 if(error){
  $("saveMsg").textContent="ক্লাউড সমস্যা: "+error.message;
  return;
 }

 allNotes=data || [];
 renderNotes();
}
async function saveNote(){
 const titleValue=$("title").value.trim();
 const contentValue=$("content").value.trim();
 const files=Array.from($("noteFiles").files || []);

 if(!titleValue && !contentValue && files.length===0){
  $("saveMsg").textContent="আগে কিছু লিখুন বা ফাইল নির্বাচন করুন।";
  return;
 }

 for(const file of files){
  if(file.size > 10 * 1024 * 1024){
   $("saveMsg").textContent="ফাইলের আকার ১০ MB-এর বেশি হতে পারবে না: "+file.name;
   return;
  }
 }

 const note={
  title:titleValue || "শিরোনামহীন নোট",
  content:contentValue,
  category:$("category").value,
  color:$("noteColor").value,
  user_id:currentUser.id
 };

 let result;
 let noteId=editingId;

 if(editingId){
  result=await db.from("notes").update(note)
  .eq("id",editingId)
  .eq("user_id",currentUser.id)
  .is("deleted_at",null);
 }else{
  result=await db.from("notes")
  .insert(note)
  .select("id")
  .single();

  if(!result.error){
   noteId=result.data.id;
  }
 }

 if(result.error){
  $("saveMsg").textContent="সংরক্ষণ হয়নি: "+result.error.message;
  return;
 }

 let uploadErrors=[];

 for(const file of files){
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const filePath=currentUser.id+"/"+noteId+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+safeName;

  const upload=await db.storage
  .from("note-attachments")
  .upload(filePath,file,{
   contentType:file.type || "application/octet-stream",
   upsert:false
  });

  if(upload.error){
   uploadErrors.push(file.name+": "+upload.error.message);
   continue;
  }

  const saved=await db.from("note_attachments").insert({
   note_id:noteId,
   user_id:currentUser.id,
   file_name:file.name,
   file_path:filePath,
   mime_type:file.type,
   file_size:file.size
  });

  if(saved.error){
   await db.storage.from("note-attachments").remove([filePath]);
   uploadErrors.push(file.name+": "+saved.error.message);
  }
 }

 if(uploadErrors.length){
  editingId=noteId;
  $("saveMsg").textContent="নোট সংরক্ষিত হয়েছে, কিন্তু কিছু ফাইল আপলোড হয়নি: "+uploadErrors.join(" | ");
  await syncNotes();
  return;
 }

 clearForm();
 $("noteFiles").value="";
 $("saveMsg").textContent="নোট ও ফাইল সফলভাবে সংরক্ষিত হয়েছে। 🎉";
 await syncNotes();
}

 $("content").value="";

async function loadNoteAttachments(noteId, card){
 const area=document.createElement("div");
 area.className="note-attachments";
 area.textContent="📎 ফাইল লোড হচ্ছে...";
 card.append(area);

 const {data,error}=await db
  .from("note_attachments")
  .select("*")
  .eq("note_id",noteId)
  .eq("user_id",currentUser.id);

 if(error){
  area.textContent="ফাইল লোড করা যায়নি।";
  return;
 }

 area.innerHTML="";

 if(!data || !data.length){
  area.remove();
  return;
 }

 for(const file of data){
  const {data:urlData,error:urlError}=await db.storage
   .from("note-attachments")
   .createSignedUrl(file.file_path,3600);

  if(urlError || !urlData){
   const p=document.createElement("p");
   p.textContent="ফাইল খোলা যায়নি: "+file.file_name;
   area.append(p);
   continue;
  }

  const section=document.createElement("div");
  section.style.marginTop="15px";
  section.style.padding="10px";
  section.style.border="1px solid #ddd";
  section.style.borderRadius="10px";

  const name=document.createElement("p");
  name.textContent="📎 "+file.file_name;
  name.style.fontWeight="bold";
  section.append(name);

  if(file.mime_type && file.mime_type.startsWith("image/")){
   const img=document.createElement("img");
   img.src=urlData.signedUrl;
   img.alt=file.file_name;
   img.style.maxWidth="100%";
   img.style.maxHeight="250px";
   img.style.objectFit="contain";
   img.style.display="block";
   section.append(img);
  }

  if(file.mime_type==="application/pdf"){
   const preview=document.createElement("iframe");
   preview.src=urlData.signedUrl;
   preview.style.width="100%";
   preview.style.height="300px";
   preview.style.border="none";
   preview.title=file.file_name;
   section.append(preview);
  }

  const open=document.createElement("a");
  open.href=urlData.signedUrl;
  open.target="_blank";
  open.rel="noopener";
  open.textContent="👁️ ফাইল খুলুন";
  open.style.marginRight="12px";
  section.append(open);

  const download=document.createElement("a");
  download.textContent="⬇️ Download";
  download.style.marginRight="12px";

  const {data:downloadData,error:downloadError}=await db.storage
   .from("note-attachments")
   .createSignedUrl(file.file_path,3600,{
    download:file.file_name
   });

  if(!downloadError && downloadData){
   download.href=downloadData.signedUrl;
   download.target="_blank";
   download.rel="noopener";
  }

  section.append(download);

  const del=document.createElement("button");
  del.type="button";
  del.textContent="🗑️ মুছুন";
  del.style.margin="8px";

  del.onclick=async()=>{
   if(!confirm("এই ফাইলটি কি সত্যিই মুছতে চান?")) return;

   del.disabled=true;
   del.textContent="মুছে ফেলা হচ্ছে...";

   const {error:storageError}=await db.storage
    .from("note-attachments")
    .remove([file.file_path]);

   if(storageError){
    alert("Storage থেকে ফাইল মোছা যায়নি।");
    del.disabled=false;
    del.textContent="🗑️ মুছুন";
    return;
   }

   const {error:dbError}=await db
    .from("note_attachments")
    .delete()
    .eq("note_id",noteId)
    .eq("user_id",currentUser.id)
    .eq("file_path",file.file_path);

   if(dbError){
    alert("ফাইল মুছে গেছে, কিন্তু রেকর্ড মুছতে সমস্যা হয়েছে।");
    return;
   }

   alert("ফাইল সফলভাবে মুছে ফেলা হয়েছে!");
   await loadNoteAttachments(noteId,card);
  };

  section.append(del);
  area.append(section);
 }
}
  
function renderNotes(){
 const q=$("search").value.toLowerCase();
 const box=$("notes");
 box.innerHTML="";

 let filtered=allNotes.filter(n=>{
  const inTrash=!!n.deleted_at;
  return inTrash===trashMode &&
  ((n.title || "").toLowerCase().includes(q) ||
  (n.content || "").toLowerCase().includes(q));
 });

 if(!trashMode){
  filtered.sort((a,b)=>Number(!!b.is_pinned)-Number(!!a.is_pinned));
 }

 if(!filtered.length){
  box.innerHTML=trashMode
  ? "<p>Trash খালি আছে।</p>"
  : "<p>এখনও কোনো নোট নেই।</p>";
  return;
 }

 filtered.forEach(n=>{
  const div=document.createElement("div");

  const small=document.createElement("p");
  small.className="small";

  const actions=document.createElement("div");
  actions.className="actions";

  if(trashMode){

   restore.textContent="♻️ Restore";
   restore.className="restore";
   restore.onclick=()=>restoreNote(n.id);

   const permanent=document.createElement("button");
   permanent.textContent="স্থায়ীভাবে মুছুন";
   permanent.className="danger";
   permanent.onclick=()=>permanentDelete(n.id);

   actions.append(restore,permanent);
  }else{

   pin.textContent=n.is_pinned ? "📌 আনপিন" : "📌 পিন";
   pin.className="secondary";
   pin.onclick=()=>togglePin(n.id,n.is_pinned);

   const edit=document.createElement("button");
   edit.textContent="এডিট";
   edit.onclick=()=>editNote(n.id);

   const del=document.createElement("button");
   del.textContent="🗑️ মুছুন";
   del.className="danger";
   del.onclick=()=>deleteNote(n.id);

   const share=document.createElement("button");
share.textContent="📤 শেয়ার";
share.className="secondary";
share.onclick=()=>shareNote(n);

actions.append(share,pin,edit,del);
  }
 div.append(h,p,small,actions);
box.append(div);

if(!trashMode){
 loadNoteAttachments(n.id,div);
}
 });
}
async function shareNote(n){

 const title=n.title || "Pocket Notebook";
 const text=title+"\n\n"+(n.content || "");

 if(navigator.share){
  try{
   await navigator.share({
    title:title,
    text:text
   });
  }catch(error){
   if(error.name!=="AbortError"){
    $("saveMsg").textContent="Share করতে সমস্যা হয়েছে।";
   }
  }
 }else{
  try{
   await navigator.clipboard.writeText(text);
   $("saveMsg").textContent="নোট কপি হয়েছে। এখন শেয়ার করুন।";
  }catch(error){
   prompt("নোটটি কপি করুন:",text);
  }
 }
}
async function togglePin(id,isPinned){
 const {error}=await db.from("notes")
 .update({is_pinned:!isPinned})
 .eq("id",id)
 .eq("user_id",currentUser.id)
 .is("deleted_at",null);

 if(error){
  $("saveMsg").textContent="পিন করতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="পিন পরিবর্তন হয়েছে।";
}

function editNote(id){
 const n=allNotes.find(x=>x.id===id && !x.deleted_at);
 if(!n)return;

 $("title").value=n.title || "";
 $("content").value=n.content || "";
 $("category").value=n.category || "ব্যক্তিগত";
 $("noteColor").value=n.color || "#ffffff";

 editingId=id;
 $("cancelEdit").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteNote(id){
 if(!confirm("নোটটি Trash-এ পাঠাবেন?"))return;

 const {error}=await db.from("notes")
 .update({deleted_at:new Date().toISOString()})
 .eq("id",id)
 .eq("user_id",currentUser.id)
 .is("deleted_at",null);

 if(error){
  $("saveMsg").textContent="মুছতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট Trash-এ পাঠানো হয়েছে।";
}

async function restoreNote(id){
 const {error}=await db.from("notes")
 .update({deleted_at:null})
 .eq("id",id)
 .eq("user_id",currentUser.id);

 if(error){
  $("saveMsg").textContent="Restore করতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট ফিরিয়ে আনা হয়েছে। ♻️";
}

async function permanentDelete(id){
 if(!confirm("এই নোটটি চিরতরে মুছে ফেলবেন? এটি আর ফিরিয়ে আনা যাবে না।"))return;

 const {error}=await db.from("notes")
 .delete()
 .eq("id",id)
 .eq("user_id",currentUser.id);

 if(error){
  $("saveMsg").textContent="স্থায়ীভাবে মুছতে সমস্যা: "+error.message;
  return;
 }

 await syncNotes();
 $("saveMsg").textContent="নোট স্থায়ীভাবে মুছে ফেলা হয়েছে।";
}


function blobToDataUrl(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}

function dataUrlToBlob(dataUrl){
 const match=/^data:([^;,]+)?;base64,([\s\S]+)$/.exec(dataUrl);

 if(!match) throw new Error("ফাইলের Backup ডেটা সঠিক নয়।");

 const mime=match[1] || "application/octet-stream";
 const binary=atob(match[2]);
 const bytes=new Uint8Array(binary.length);

 for(let i=0;i<binary.length;i++){
  bytes[i]=binary.charCodeAt(i);
 }

 return new Blob([bytes],{type:mime});
}

async function exportBackup(){

 if(!currentUser){
  alert("আগে লগইন করুন।");
  return;
 }

 try{

  $("saveMsg").textContent="Backup তৈরি হচ্ছে...";

  const notes=allNotes.map(n=>({
   backup_id:n.id,
   title:n.title || "",
   content:n.content || "",
   category:n.category || "অন্যান্য",
   color:n.color || "#ffffff",
   is_pinned:!!n.is_pinned,
   deleted_at:n.deleted_at || null
  }));

  const noteIds=notes.map(n=>n.backup_id).filter(Boolean);

  let attachments=[];

  if(noteIds.length){

   const {data:files,error}=await db
    .from("note_attachments")
    .select("*")
    .eq("user_id",currentUser.id)
    .in("note_id",noteIds);

   if(error) throw error;

   for(const file of files || []){

    const {data:blob,error:downloadError}=await db.storage
     .from("note-attachments")
     .download(file.file_path);

    if(downloadError) throw downloadError;

    attachments.push({
     note_backup_id:file.note_id,
     file_name:file.file_name,
     mime_type:file.mime_type || blob.type,
     file_size:file.file_size || blob.size,
     data_url:await blobToDataUrl(blob)
    });
   }
  }

  const backup={
   app:"Pocket Notebook",
   version:2,
   exported_at:new Date().toISOString(),
   notes,
   attachments
  };

  const blob=new Blob(
   [JSON.stringify(backup)],
   {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="Pocket-Notebook-Backup.json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);

  $("saveMsg").textContent=
   "নোট ও সংযুক্ত ফাইলসহ Backup ডাউনলোড হয়েছে! 📥";

 }catch(error){

  alert("Backup তৈরি করা যায়নি: "+error.message);

 }
}

async function importBackup(event){

 const file=event.target.files[0];

 if(!file)return;

 if(!currentUser){
  alert("আগে লগইন করুন।");
  event.target.value="";
  return;
 }

 try{

  const text=await file.text();
  const backup=JSON.parse(text);

  if(backup.app!=="Pocket Notebook" ||
     !Array.isArray(backup.notes)){
   throw new Error("সঠিক Pocket Notebook Backup ফাইল নয়।");
  }

  if(backup.notes.length===0){
   alert("Backup-এ কোনো নোট নেই।");
   return;
  }

  if(!confirm(
   backup.notes.length+
   "টি নোট Import করবেন? আগের নোট মুছবে না, নতুন কপি যুক্ত হবে।"
  )){
   return;
  }

  let restoredNotes=0;
  let restoredFiles=0;
  let errors=[];

  for(const n of backup.notes){

   const note={
    title:String(n.title || "শিরোনামহীন নোট"),
    content:String(n.content || ""),
    category:String(n.category || "অন্যান্য"),
    color:typeof n.color==="string" ? n.color : "#ffffff",
    is_pinned:!!n.is_pinned,
    deleted_at:n.deleted_at || null,
    user_id:currentUser.id
   };

   const {data:newNote,error:noteError}=await db
    .from("notes")
    .insert(note)
    .select("id")
    .single();

   if(noteError){
    errors.push("নোট: "+noteError.message);
    continue;
   }

   restoredNotes++;

   const oldId=n.backup_id || n.id;

   const files=(backup.attachments || []).filter(
    f=>oldId && String(f.note_backup_id)===String(oldId)
   );

   for(const f of files){

    try{

     const blob=dataUrlToBlob(f.data_url);

     const safeName=f.file_name.replace(
      /[^a-zA-Z0-9._-]/g,"_"
     );

     const filePath=
      currentUser.id+"/"+newNote.id+"/"+
      Date.now()+"_"+Math.random().toString(36).slice(2)+
      "_"+safeName;

     const {error:uploadError}=await db.storage
      .from("note-attachments")
      .upload(filePath,blob,{
       contentType:f.mime_type || blob.type,
       upsert:false
      });

     if(uploadError) throw uploadError;

     const {error:savedError}=await db
      .from("note_attachments")
      .insert({
       note_id:newNote.id,
       user_id:currentUser.id,
       file_name:f.file_name,
       file_path:filePath,
       mime_type:f.mime_type || blob.type,
       file_size:blob.size
      });

     if(savedError){
      await db.storage.from("note-attachments").remove([filePath]);
      throw savedError;
     }

     restoredFiles++;

    }catch(fileError){

     errors.push(
      "ফাইল "+f.file_name+": "+fileError.message
     );

    }
   }
  }

  await syncNotes();

  $("saveMsg").textContent=
   restoredNotes+"টি নোট এবং "+restoredFiles+
   "টি ফাইল Restore হয়েছে।";

  if(errors.length){
   alert(
    "কিছু অংশ Restore হয়েছে, তবে কিছু সমস্যা হয়েছে:\n"+
    errors.join("\n")
   );
  }else{
   alert(
    "সফলভাবে "+restoredNotes+
    "টি নোট এবং "+restoredFiles+
    "টি ফাইল Restore হয়েছে! 🎉"
   );
  }

 }catch(error){

  alert("Backup Import করতে সমস্যা: "+error.message);

 }finally{

  event.target.value="";

 }
}
  
 
db.auth.getSession().then(({data})=>{
 if(data.session) startApp(data.session.user);
});
